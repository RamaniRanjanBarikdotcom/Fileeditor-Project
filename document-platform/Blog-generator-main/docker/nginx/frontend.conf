server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Local image uploads are sent as base64 data-URLs in the JSON body, which inflates
  # the payload by ~33%. Match the backend's 25 MB bodyLimit (server.js) so nginx
  # doesn't reject uploads with HTTP 413 before they reach the API. The default is 1 MB.
  client_max_body_size 25m;

  # API → Node backend
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Blog generation is a single long-running POST (multiple AI calls). Allow it
    # to run for several minutes before the proxy gives up.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # WebSocket → Node backend
  location /ws {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
