services:
  # ─── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: docconv-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: docconv
      POSTGRES_PASSWORD: docconv_secret
      POSTGRES_DB: docconv
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docconv"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: docconv-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible object storage) ────────────────────
  minio:
    image: minio/minio:latest
    container_name: docconv-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MinIO bucket initialization ─────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: docconv-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set docconv http://minio:9000 minioadmin minioadmin;
      mc mb docconv/docconv-quarantine --ignore-existing;
      mc mb docconv/docconv-inputs --ignore-existing;
      mc mb docconv/docconv-outputs --ignore-existing;
      mc mb docconv/docconv-previews --ignore-existing;
      mc mb docconv/docconv-templates --ignore-existing;
      echo 'All buckets created successfully';
      exit 0;
      "

  # ─── Gotenberg (Chromium + LibreOffice document conversion) ──
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: docconv-gotenberg
    restart: unless-stopped
    ports:
      - "3100:3000"
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=false"
      - "--chromium-clear-cookies"
      - "--chromium-clear-storage"
      - "--chromium-deny-private-ips"
      - "--chromium-allow-list=^file:///tmp/.*$|^https?://.*$"
      - "--api-timeout=240s"
      - "--log-level=info"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS API ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: docconv-api
    restart: unless-stopped
    ports:
      - "4201:4201"
    environment:
      NODE_ENV: production
      PORT: 4201
      APP_URL: http://localhost:5173
      PUBLIC_WEB_URL: http://localhost:5173
      DATABASE_URL: postgresql://docconv:docconv_secret@postgres:5432/docconv?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-development-secret-change-before-production
      JWT_REFRESH_SECRET: local-development-refresh-secret-change-before-production
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_REGION: us-east-1
      STORAGE_FORCE_PATH_STYLE: "true"
      GOTENBERG_URL: http://gotenberg:3000
      FILE_RETENTION_HOURS: 24
      MAX_UPLOAD_SIZE_BYTES: 26214400
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
      IP_HMAC_SECRET: local-anonymous-quota-secret-change-before-production
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-ToolSuite <onboarding@resend.dev>}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    command:
      - /bin/sh
      - -c
      - corepack pnpm --filter @docconv/api exec prisma db push --skip-generate && corepack pnpm --filter @docconv/api exec prisma db seed && node apps/api/dist/main.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4201/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Conversion Worker ──────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: docconv-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://docconv:docconv_secret@postgres:5432/docconv?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_REGION: us-east-1
      STORAGE_FORCE_PATH_STYLE: "true"
      GOTENBERG_URL: http://gotenberg:3000
      CONVERSION_TIMEOUT_MS: 180000
      URL_CONVERSION_TIMEOUT_MS: 240000
      CHROMIUM_WAIT_DELAY: 5s
      MAX_OUTPUT_SIZE_BYTES: 104857600
      MAX_OCR_PAGES: 100
      OCR_LANGUAGES: eng
    depends_on:
      api:
        condition: service_healthy
      gotenberg:
        condition: service_healthy

  # ─── React Web Application ──────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_API_URL: http://api:4201
    container_name: docconv-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      INTERNAL_API_URL: http://api:4201
      NEXT_PUBLIC_SITE_URL: http://localhost:5173
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
