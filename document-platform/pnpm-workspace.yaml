packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  tar: '>=7.5.21'
  multer: '>=2.3.0'
  dompurify: '>=3.4.12'
  deepmerge-ts: '>=8.0.0'
  qs: '>=6.16.0'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  electron-winstaller: true
  # msgpackr treats this native addon as an optional accelerator and falls
  # back to its JavaScript decoder when it is unavailable. Disabling its
  # lifecycle build keeps arm64 Docker installs deterministic and avoids a
  # node-gyp toolchain in the runtime images.
  msgpackr-extract: false
  prisma: true
  # Puppeteer's lifecycle script is reviewed. Docker uses system Chromium,
  # while native development installs may download Puppeteer's pinned browser.
  puppeteer: true
